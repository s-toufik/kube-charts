global: {timezone: Europe/Paris}
parameters: {shared_buffers: 1GB, max_connections: "200"}
roles:
  - {name: tasker_web, login: false}
  - {name: postgrest, login: true, inherit: false, inRoles: [tasker_web], passwordSecret: {name: pg-role-postgrest}}
  - {name: keycloak, login: true, passwordSecret: {name: pg-role-keycloak}}
databases:
  - {name: keycloak, owner: keycloak}
