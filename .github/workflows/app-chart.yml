# Called by an app repository after it pushed its image for a release tag vX.Y.Z:
# publishes oci://ghcr.io/<owner>/charts/<name>:X.Y.Z — the generic app chart with the app's
# devops/helm/values.yml built in, running image <image>:X.Y.Z.
#
#   chart:
#     needs: publish
#     if: startsWith(github.ref, 'refs/tags/v')
#     uses: s-toufik/kube-charts/.github/workflows/app-chart.yml@main
#     permissions: { contents: read, packages: write }
#     with:
#       name: homelab-ui
#       image: toufik142/homelab-ui
name: App chart

on:
  workflow_call:
    inputs:
      name:
        description: Chart and release name, e.g. homelab-ui
        required: true
        type: string
      image:
        description: Image repository, e.g. toufik142/homelab-ui (its tag is the version)
        required: true
        type: string
      values-file:
        description: The app's chart values
        required: false
        type: string
        default: devops/helm/values.yml
      app-chart-version:
        description: Version of the generic app chart to build on (empty = latest)
        required: false
        type: string
        default: ""

jobs:
  chart:
    name: 📦 CHART
    runs-on: ubuntu-latest
    steps:
      - name: Version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z, got '$tag'"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Get the packaging script
        uses: actions/checkout@v4
        with:
          repository: s-toufik/kube-charts
          path: .kube-charts
          sparse-checkout: scripts

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the chart
        id: package
        env:
          APP_CHART: oci://ghcr.io/s-toufik/charts/app
          APP_CHART_VERSION: ${{ inputs.app-chart-version }}
        run: |
          package="$(.kube-charts/scripts/package-app.sh "${{ inputs.name }}" "${{ steps.version.outputs.version }}" \
            "${{ inputs.image }}" "${{ inputs.values-file }}" "$RUNNER_TEMP/dist")"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Push the chart
        run: helm push "${{ steps.package.outputs.package }}" "oci://ghcr.io/${{ github.repository_owner }}/charts"
